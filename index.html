<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Interaktif - Muiz Adkha Maulana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <!-- Foto Profil -->
        <div class="profile-pic">
            <img src="https://via.placeholder.com/150" alt="Foto Profil">
        </div>

        <h1>Halo! Selamat Datang 👋</h1>
        <p class="tagline">Klik tombol di bawah untuk mengenal saya lebih jauh!</p>

        <!-- Area Tombol Interaktif (Tanpa onclick di HTML) -->
        <div class="button-group">
            <button id="btnNama">👤 Nama</button>
            <button id="btnTtl">📅 Tempat & Tgl Lahir</button>
            <button id="btnAlamat">🏠 Alamat</button>
            <button id="btnJurusan">🎓 Jurusan</button>
        </div>

        <!-- Kotak Hasil Informasi -->
        <div class="info-box" id="infoBox">
            <p id="infoText">Pilih salah satu tombol di atas untuk melihat detail data diri saya!</p>
        </div>

        <!-- Tombol Sapa Tambahan -->
        <button id="btnSapa" class="btn-sapa">Kirim Salam 👋</button>
        <p id="pesanSapa"></p>
    </div>

    <!-- Panggil file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
