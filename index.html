<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Interaktif - Muiz Adkha Maulana</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            text-align: center;
            max-width: 420px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .profile-pic img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 5px;
        }

        .tagline {
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
        }

        /* Tampilan Menu Utama (Tombol-tombol) */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .button-group button {
            background-color: #f0f3ff;
            color: #4a5568;
            border: 2px solid #667eea;
            padding: 12px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .button-group button:hover {
            background-color: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        /* Tombol Sapa */
        .btn-sapa {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: opacity 0.2s;
            width: 100%;
        }

        .btn-sapa:hover {
            opacity: 0.9;
        }

        #pesanSapa {
            margin-top: 10px;
            font-size: 13px;
            color: #28a745;
            font-weight: bold;
        }

        /* Kelas untuk Menyembunyikan Elemen */
        .hidden {
            display: none !important;
        }

        /* Tampilan Halaman Slide / Tab Detail Baru */
        #detailSection {
            animation: fadeIn 0.4s ease-in-out;
        }

        .detail-card {
            background-color: #f8fafc;
            border: 2px solid #667eea;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        .detail-title {
            font-size: 12px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .detail-content {
            font-size: 16px;
            color: #2d3748;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #cbd5e0;
        }

        /* Kotak Komentar / Catatan Tambahan */
        .detail-comment {
            font-size: 13px;
            color: #4a5568;
            background-color: #edf2f7;
            padding: 10px;
            border-radius: 8px;
            font-style: italic;
            line-height: 1.4;
        }

        /* Tombol Kembali */
        .btn-back {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s ease;
            width: 100%;
        }

        .btn-back:hover {
            background-color: #c53030;
        }

        /* Animasi Transisi Halus */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="card-container">
        
        <!-- BAGIAN 1: MENU UTAMA (TAMPIL AWAL) -->
        <div id="mainMenu">
            <div class="profile-pic">
                <img src="https://via.placeholder.com/150" alt="Foto Profil">
            </div>

            <h1>Halo! Selamat Datang 👋</h1>
            <p class="tagline">Pilih menu di bawah untuk melihat data diri saya!</p>

            <div class="button-group">
                <button onclick="bukaTab('Nama Lengkap', 'MUIZ ADKHA MAULANA', 'Nama lengkap saya, biasa dipanggil Muiz. Senang bisa berkenalan dengan teman-teman semua di sini!', '👤')">👤 Nama</button>
                <button onclick="bukaTab('Tempat & Tanggal Lahir', 'MALANG, 21 NOVEMBER 2009', 'Lahir di Kota Malang dan bangga menjadi bagian dari arek Malang.', '📅')">📅 TTL</button>
                <button onclick="bukaTab('Alamat Domisili', 'LEBAKHARJO, AMPELGADING', 'Tinggal di daerah Lebakharjo, Ampelgading. Suasananya sejuk, asri, dan ramah!', '🏠')">🏠 Alamat</button>
                <button onclick="bukaTab('Jurusan Sekolah', 'TKJ (Teknik Komputer dan Jaringan)', 'Sebagai anak TKJ, saya belajar merakit jaringan sekaligus mengeksplorasi web development seperti ini!', '🎓')">🎓 Jurusan</button>
            </div>

            <button class="btn-sapa" onclick="sapa()">Kirim Salam 👋</button>
            <p id="pesanSapa"></p>
        </div>

        <!-- BAGIAN 2: SLIDE / TAB DETAIL BARU (LENGKAP DENGAN KOMENTAR) -->
        <div id="detailSection" class="hidden">
            <div class="profile-pic">
                <img src="https://via.placeholder.com/150" alt="Foto Profil">
            </div>
            
            <h1 id="tabIconTitle">Detail Informasi</h1>
            <p class="tagline">Slide Biodata Interaktif</p>

            <div class="detail-card">
                <div class="detail-title" id="judulKategori">KATEGORI</div>
                <div class="detail-content" id="isiJawaban">Isi jawaban akan tampil di sini</div>
                
                <div class="detail-title">💬 Komentar / Catatan:</div>
                <div class="detail-comment" id="isiKomentar">Komentar tambahan akan tampil di sini</div>
            </div>

            <button class="btn-back" onclick="kembaliKeMenu()">⬅ Kembali ke Menu Utama</button>
        </div>

    </div>

    <!-- Kode JavaScript Pengatur Slide & Komentar -->
    <script>
        function bukaTab(kategori, jawaban, komentar, ikon) {
            // 1. Sembunyikan Menu Utama
            document.getElementById('mainMenu').classList.add('hidden');
            
            // 2. Masukkan data teks, jawaban, dan komentar ke dalam slide baru
            document.getElementById('judulKategori').textContent = kategori;
            document.getElementById('isiJawaban').textContent = jawaban;
            document.getElementById('isiKomentar.textContent', komentar); // Diperbaiki di bawah
            document.getElementById('isiKomentar').textContent = '"' + komentar + '"';
            document.getElementById('tabIconTitle').textContent = ikon + " " + kategori;

            // 3. Tampilkan Slide Detail Baru
            document.getElementById('detailSection').classList.remove('hidden');
        }

        function kembaliKeMenu() {
            // 1. Sembunyikan Slide Detail
            document.getElementById('detailSection').classList.add('hidden');
            
            // 2. Tampilkan Kembali Menu Utama
            document.getElementById('mainMenu').classList.remove('hidden');
            
            // Bersihkan pesan sapaan
            document.getElementById('pesanSapa').textContent = "";
        }

        function sapa() {
            document.getElementById('pesanSapa').textContent = "Terima kasih sudah menyapa! Semangat belajarnya ya! ✨";
        }
    </script>
</body>
</html>
