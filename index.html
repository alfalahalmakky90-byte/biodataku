<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Bio | MUIZ ADKHA MAULANA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container" id="hero-card">
        <!-- Badge Status -->
        <div class="badge">CLASSIFIED DOSSIER</div>

        <!-- Profil Header -->
        <div class="profile-header">
            <div class="avatar-box">
                <img src="https://via.placeholder.com/120" alt="Foto Profil" id="profile-img">
            </div>
            <h1 id="hero-name">MUIZ ADKHA MAULANA</h1>
            <p class="alias" id="hero-alias">Classified Agent Dossier</p>
        </div>

        <!-- Tombol Data Diri (Informasi Spesifik) -->
        <div class="info-buttons">
            <button class="btn-info" onclick="showInfo('Nama Lengkap', 'MUIZ ADKHA MAULANA')">👤 Nama</button>
            <button class="btn-info" onclick="showInfo('Tanggal Lahir', '21 NOVEMBER 2009')">📅 TTL</button>
            <button class="btn-info" onclick="showInfo('Alamat Rumah', 'LEBAKHARJO, AMPELGADING')">🏠 Alamat</button>
            <button class="btn-info" onclick="showInfo('Asal Sekolah', 'SMA PLUS ALFALAH ALMAKKY')">🏫 Sekolah</button>
            <button class="btn-info" onclick="showInfo('Alamat Sekolah', 'PUTATLOR, GONDANGLEGI')">📍 Lokasi Sekolah</button>
            <button class="btn-info" onclick="showInfo('Kelas Saat Ini', 'XI-A')">🎓 Kelas</button>
            <button class="btn-info" onclick="showInfo('Peminatan / Jurusan', 'IPA / INFORMATIKA TINGKAT LANJUT')">💻 Jurusan</button>
            <!-- Tombol Instagram Baru -->
            <button class="btn-info btn-ig" onclick="showInfo('Instagram', '@username_kamu')">📸 Instagram</button>
        </div>

        <!-- Display Area Informasi yang Diklik -->
        <div class="display-box">
            <span class="display-label" id="info-label">PETUNJUK:</span>
            <p class="display-value" id="info-value">Klik tombol di atas untuk melihat detail data pahlawan!</p>
        </div>

        <!-- Action Buttons Spider-Man & Link Sosmed -->
        <div class="action-buttons">
            <!-- Ganti href dengan username Instagram kamu yang sebenarnya -->
            <a href="https://instagram.com/username_kamu" target="_blank" class="btn btn-instagram">📸 Kunjungi Instagram Saya</a>
            <button id="spider-sense-btn" class="btn btn-warning">🕷️ Aktifkan Spider-Sense</button>
            <button id="toggle-identity-btn" class="btn btn-primary">🔄 Ubah Identitas Rahasia</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
