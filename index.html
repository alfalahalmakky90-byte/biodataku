<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Interaktif - Nama Anda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <!-- Foto Profil -->
        <div class="profile-pic">
            <img src="https://via.placeholder.com/150" alt="Foto Profil">
        </div>

        <!-- Informasi Utama -->
        <h1>Halo, Saya <span id="typing-name">Nama Anda</span></h1>
        <p class="tagline">Pelajar / Developer Pemula / Enthusiast Teknologi</p>

        <!-- Bagian Biodata -->
        <div class="bio-details">
            <div class="info-item"><strong>Asal:</strong> Kota Anda</div>
            <div class="info-item"><strong>Hobi:</strong> Ngoding, Membaca, Olahraga</div>
            <div class="info-item"><strong>Cita-cita:</strong> Menjadi Software Engineer</div>
        </div>

        <!-- Tombol Interaktif -->
        <button id="sapaButton">Klik untuk Sapa Saya!</button>
        <p id="pesanInteraktif"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
