<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata - Sunflower</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #333;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .music-btn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 20px;
            background-color: #ffb703;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .music-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌻 Selamat Datang di Biodata Saya</h1>
        <p>🎵 Playing: <b>Post Malone, Swae Lee - Sunflower</b></p>
        
        <!-- Tombol Kontrol Suara -->
        <button class="music-btn" id="musicBtn" onclick="togglePlay()">⏸️ Jeda Musik</button>
    </div>

    <!-- Elemen Audio menggunakan Link Streaming MP3 Sunflower -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://ia801503.us.archive.org/15/items/post-malone-swae-lee-sunflower-spider-man-into-the-spider-verse/Post%20Malone%2C%20Swae%20Lee%20-%20Sunflower%20%28Spider-Man_%20Into%20the%20Spider-Verse%29.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <script>
        const audio = document.getElementById('bgMusic');
        const btn = document.getElementById('musicBtn');

        // Fungsi Memutar / Menghentikan Musik
        function togglePlay() {
            if (audio.paused) {
                audio.play();
                btn.innerHTML = "⏸️ Jeda Musik";
            } else {
                audio.pause();
                btn.innerHTML = "🎵 Putar Musik";
            }
        }

        // Trik Autoplay: Mencoba memutar audio, jika diblokir browser, tunggu klik pertama pengunjung
        function startAudio() {
            audio.play().then(() => {
                btn.innerHTML = "⏸️ Jeda Musik";
            }).catch(() => {
                btn.innerHTML = "🎵 Klik di mana saja untuk memutar Sunflower";
                
                // Menunggu interaksi klik/sentuhan pertama pengguna di layar
                const playOnFirstInteraction = () => {
                    audio.play().then(() => {
                        btn.innerHTML = "⏸️ Jeda Musik";
                    });
                    document.removeEventListener('click', playOnFirstInteraction);
                    document.removeEventListener('touchstart', playOnFirstInteraction);
                };

                document.addEventListener('click', playOnFirstInteraction);
                document.addEventListener('touchstart', playOnFirstInteraction);
            });
        }

        // Jalankan saat halaman dibuka
        window.addEventListener('DOMContentLoaded', startAudio);
    </script>

</body>
</html>
